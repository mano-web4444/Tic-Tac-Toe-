<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Player Vs Computer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="customPopup" class="custom-popup">
  <div class="popup-box">
    <h2>🎮 Mano says</h2>
    <p id="popupMessage"></p>
    <button id="popupOk">OK</button>
  </div>
  </div>

  <h1>👯Player Vs Computer🤖</h1>
  <div class="difficulty-box">
  <p>🎯 Difficulty</p>

  <button class="difficulty-btn" data-level="easy">
    🟢 Easy
  </button>

  <button class="difficulty-btn" data-level="medium">
    🟡 Medium
  </button>

  <button class="difficulty-btn" data-level="hard">
    🔴 Hard
  </button>
  </div>

  <p id="turnMessage">Your turn</p>

  <div class="game-board" id="computerBoard">

    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>

    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>

    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>

  </div>

  <button id="restart">🔄 Restart Game</button>

  <button id="backMenu">🔙 Back to Menu</button>

  <script src="script.js"></script>
<footer> Made with ❤️ | Tic Tac Toe </footer>

</body>

</html>
